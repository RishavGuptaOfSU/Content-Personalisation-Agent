<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Multi-agent AI personalization platform with per-agent profiles, semantic memory and a feedback loop."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ctext x='16' y='22' font-family='system-ui' font-size='16' font-weight='700' fill='white' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E" />
    <title>Content Personalization Agent</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      (function () {
        try {
          const stored = localStorage.getItem('cpa.theme')
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark')
          }
        } catch (_) {}
      })()
    </script>
    <script>
      /**
       * Boot watchdog.
       *
       * If the module graph fails to load (a syntax error in any imported file,
       * a blocked request, a stale cached module) then NO application code runs
       * and the page stays blank with the reason only visible in the console.
       * This inline script does not depend on the bundle, so it can still report
       * what went wrong.
       */
      (function () {
        var errors = []
        var booted = false

        window.__cpaBooted = function () {
          booted = true
        }

        function record(kind, message, source, line, col, stack) {
          errors.push({
            kind: kind,
            message: String(message || 'unknown error'),
            source: source || '',
            line: line,
            col: col,
            stack: stack || '',
          })
        }

        window.addEventListener('error', function (event) {
          if (event.target && event.target.tagName === 'SCRIPT') {
            record('script-load', 'Failed to load script: ' + (event.target.src || '(inline)'))
            return
          }
          record(
            'error',
            event.message,
            event.filename,
            event.lineno,
            event.colno,
            event.error && event.error.stack,
          )
        })

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason
          record(
            'unhandled-rejection',
            (reason && (reason.message || reason)) || 'promise rejected',
            '',
            null,
            null,
            reason && reason.stack,
          )
        })

        function escapeHtml(value) {
          return String(value).replace(/[&<>"']/g, function (ch) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]
          })
        }

        function diagnose() {
          var root = document.getElementById('root')
          if (booted || !root || root.children.length > 0) return

          var apiBase = 'http://localhost:8000'
          var hasToken = false
          try {
            hasToken = Boolean(localStorage.getItem('cpa.token'))
          } catch (_) {}

          var rows = [
            ['Page URL', location.href],
            ['Viewport', window.innerWidth + ' x ' + window.innerHeight],
            ['Saved session token', hasToken ? 'present' : 'none (you would be sent to sign in)'],
            ['Captured errors', errors.length ? String(errors.length) : 'none'],
          ]

          var errorHtml = errors.length
            ? errors
                .map(function (e) {
                  return (
                    '<div style="margin-top:10px;padding:10px;border-radius:8px;background:#7f1d1d33;border:1px solid #f8717155">' +
                    '<div style="font-weight:600;color:#fca5a5">' +
                    escapeHtml(e.kind) +
                    '</div><div style="margin-top:4px">' +
                    escapeHtml(e.message) +
                    '</div>' +
                    (e.source
                      ? '<div style="margin-top:4px;opacity:.75;font-size:12px">' +
                        escapeHtml(e.source) +
                        (e.line ? ':' + e.line + ':' + e.col : '') +
                        '</div>'
                      : '') +
                    (e.stack
                      ? '<pre style="margin:6px 0 0;white-space:pre-wrap;font-size:11px;opacity:.7;max-height:160px;overflow:auto">' +
                        escapeHtml(e.stack) +
                        '</pre>'
                      : '') +
                    '</div>'
                  )
                })
                .join('')
            : '<p style="margin-top:10px;opacity:.75">No JavaScript error was captured, which usually means a module request was blocked or served from a stale cache. A hard reload (Ctrl+Shift+R) normally clears it.</p>'

          root.innerHTML =
            '<div style="font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:760px;margin:0 auto;padding:40px 24px;color:#e2e8f0">' +
            '<h1 style="margin:0;font-size:20px;font-weight:600">The interface did not start</h1>' +
            '<p style="margin:8px 0 0;opacity:.8">The page loaded but the application bundle never mounted. Details below.</p>' +
            errorHtml +
            '<table style="margin-top:20px;width:100%;border-collapse:collapse;font-size:13px">' +
            rows
              .map(function (r) {
                return (
                  '<tr><td style="padding:6px 10px 6px 0;opacity:.7;white-space:nowrap">' +
                  escapeHtml(r[0]) +
                  '</td><td style="padding:6px 0;word-break:break-all">' +
                  escapeHtml(r[1]) +
                  '</td></tr>'
                )
              })
              .join('') +
            '</table>' +
            '<div id="cpa-api-probe" style="margin-top:16px;font-size:13px;opacity:.8">Checking the API…</div>' +
            '<div style="margin-top:24px;display:flex;gap:10px;flex-wrap:wrap">' +
            '<button onclick="location.reload(true)" style="cursor:pointer;border:0;border-radius:8px;padding:9px 14px;background:#4f46e5;color:#fff;font-size:13px;font-weight:500">Reload</button>' +
            '<button onclick="try{localStorage.clear()}catch(e){};location.replace(\'/login\')" style="cursor:pointer;border:1px solid #475569;border-radius:8px;padding:9px 14px;background:transparent;color:#e2e8f0;font-size:13px">Clear session and sign in</button>' +
            '</div></div>'

          document.body.style.background = '#020617'

          // Report whether the backend is reachable from this browser, which
          // distinguishes a frontend problem from an API/CORS problem.
          fetch(apiBase + '/health', { mode: 'cors' })
            .then(function (response) {
              return response.json()
            })
            .then(function (health) {
              document.getElementById('cpa-api-probe').textContent =
                'API reachable at ' +
                apiBase +
                ' — status "' +
                health.status +
                '", model ' +
                ((health.providers && health.providers.llm && health.providers.llm.model) || '?')
            })
            .catch(function (error) {
              document.getElementById('cpa-api-probe').innerHTML =
                '<span style="color:#fca5a5">API NOT reachable at ' +
                apiBase +
                ' (' +
                escapeHtml(error.message) +
                '). Start the backend, or check that a browser shield/extension is not blocking localhost requests.</span>'
            })
        }

        setTimeout(diagnose, 5000)
      })()
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
