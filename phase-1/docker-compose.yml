name: content-personalization-agent

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cpa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cpa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cpa}
      POSTGRES_DB: ${POSTGRES_DB:-content_personalization}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init-pgvector.sql:/docker-entrypoint-initdb.d/00-init-pgvector.sql:ro
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cpa} -d ${POSTGRES_DB:-content_personalization}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Optional local model server. Start it with:
  #   docker compose --profile ollama up -d ollama
  #   docker compose exec ollama ollama pull llama3.2:3b
  #   docker compose exec ollama ollama pull nomic-embed-text
  # Omit the profile to use an Ollama running on the host instead
  # (set OLLAMA_BASE_URL=http://host.docker.internal:11434).
  ollama:
    image: ollama/ollama:latest
    container_name: cpa-ollama
    profiles: ["ollama"]
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    container_name: cpa-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Lets the container reach a model server running on the host machine.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://cpa:cpa@postgres:5432/content_personalization}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production-please-use-a-long-random-string}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:4173}

      # ---- provider selection ----
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-700}
      ROUTER_USE_LLM: ${ROUTER_USE_LLM:-true}
      ROUTER_LLM_MIN_MARGIN: ${ROUTER_LLM_MIN_MARGIN:-3.0}
      MEMORY_LLM_EXTRACTION: ${MEMORY_LLM_EXTRACTION:-false}

      # ---- ollama ----
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      OLLAMA_ROUTER_MODEL: ${OLLAMA_ROUTER_MODEL:-llama3.2:3b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-600}

      # ---- openai-compatible ----
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}

      # ---- bedrock ----
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-anthropic.claude-3-5-sonnet-20240620-v1:0}
      BEDROCK_ROUTER_MODEL_ID: ${BEDROCK_ROUTER_MODEL_ID:-anthropic.claude-3-haiku-20240307-v1:0}
      BEDROCK_EMBEDDING_MODEL_ID: ${BEDROCK_EMBEDDING_MODEL_ID:-amazon.titan-embed-text-v2:0}

      # ---- embeddings ----
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      MEMORY_MIN_SIMILARITY: ${MEMORY_MIN_SIMILARITY:-0.25}

      # ---- image / chart rendering ----
      # "local" renders typographic cards with Pillow (no GPU, no key);
      # "openai" routes the same spec to gpt-image-1. Charts are always
      # matplotlib. Rendered files live on the generated_media volume below so
      # they survive a container restart.
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-local}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-1}
      MEDIA_ROOT: /app/generated_media
      MEDIA_MAX_FILES: ${MEDIA_MAX_FILES:-400}

      # ---- scope guard (see backend/.env.example) ----
      SCOPE_OWN_MAX_SCORE: ${SCOPE_OWN_MAX_SCORE:-1.5}
      SCOPE_OTHER_MIN_SCORE: ${SCOPE_OTHER_MIN_SCORE:-4.0}
      SCOPE_MIN_MARGIN: ${SCOPE_MIN_MARGIN:-3.0}
      ROUTER_KEYWORD_MIN_SCORE: ${ROUTER_KEYWORD_MIN_SCORE:-4.0}
    volumes:
      - generated_media:/app/generated_media
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
    container_name: cpa-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

volumes:
  postgres_data:
  ollama_models:
  generated_media:
