<!DOCTYPE html>
<html>
<head>
<style>
@page {
    size: A4 portrait;
    margin: 0;
}
body {
    margin: 0;
    padding: 0;
    font-family: 'Times New Roman', serif;
}
.page {
    width: 210mm;
    height: 297mm;
    box-sizing: border-box;
    padding: 20mm;
    position: relative;
    page-break-after: always;
}
.border-box {
    position: absolute;
    top: 10mm;
    left: 10mm;
    right: 10mm;
    bottom: 10mm;
    border: 3px double #000;
    box-sizing: border-box;
}
.page-num {
    position: absolute;
    top: 14mm;
    right: 14mm;
    font-size: 11pt;
}
.content {
    margin-top: 10mm;
}
</style>
</head>
<body>
<div class='page'>
    <div class='border-box'></div>
    <div class='page-num'>1</div>
    <div class='content'>
        <h1 style='text-align: center;'>Test Page 1</h1>
    </div>
</div>
<div class='page'>
    <div class='border-box'></div>
    <div class='page-num'>2</div>
    <div class='content'>
        <h1 style='text-align: center;'>Test Page 2</h1>
    </div>
</div>
</body>
</html>
